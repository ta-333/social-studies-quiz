<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中1社会 期末テスト対策</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Segoe UI', 'Yu Gothic UI', 'Meiryo', sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.container {
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  width: 100%;
  max-width: 640px;
  overflow: hidden;
}

.header {
  background: linear-gradient(135deg, #f093fb, #f5576c);
  color: #fff;
  padding: 22px 28px;
  text-align: center;
}

.header h1 { font-size: 1.5em; margin-bottom: 4px; }
.header p { font-size: 0.85em; opacity: 0.9; }

.stats {
  display: flex;
  justify-content: center;
  gap: 28px;
  padding: 14px 28px;
  background: #f8f9ff;
  border-bottom: 1px solid #e8ecf4;
}

.stat { text-align: center; }
.stat-value { font-size: 1.7em; font-weight: 700; color: #f5576c; }
.stat-label { font-size: 0.72em; color: #888; margin-top: 2px; }

.progress-bar { height: 5px; background: #e8ecf4; }
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #f093fb, #f5576c);
  transition: width 0.4s ease;
  width: 0%;
}

.content { padding: 28px; }

.category-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 12px;
}

.category-btn {
  padding: 16px 10px;
  border: 2px solid #e8ecf4;
  border-radius: 12px;
  background: #fff;
  cursor: pointer;
  transition: all 0.2s;
  text-align: center;
}

.category-btn:hover {
  border-color: #f5576c;
  background: #fff5f7;
  transform: translateY(-2px);
}

.category-btn .emoji { font-size: 1.8em; display: block; margin-bottom: 6px; }
.category-btn .name { font-weight: 600; color: #333; font-size: 0.85em; }
.category-btn .count { font-size: 0.72em; color: #999; margin-top: 3px; }

.category-tag {
  display: inline-block;
  background: #ffeef2;
  color: #f5576c;
  padding: 4px 14px;
  border-radius: 20px;
  font-size: 0.78em;
  font-weight: 600;
  margin-bottom: 14px;
}

.question-number { font-size: 0.82em; color: #aaa; margin-bottom: 6px; }

.question-text {
  font-size: 1.15em;
  font-weight: 600;
  color: #333;
  line-height: 1.7;
  margin-bottom: 22px;
}

.answer-area { display: flex; gap: 10px; }

.answer-input {
  flex: 1;
  padding: 13px 16px;
  border: 2px solid #e0e4ec;
  border-radius: 12px;
  font-size: 1.05em;
  outline: none;
  transition: border-color 0.2s;
}

.answer-input:focus { border-color: #f5576c; }

.submit-btn {
  padding: 13px 22px;
  background: linear-gradient(135deg, #f093fb, #f5576c);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s, opacity 0.2s;
  white-space: nowrap;
}

.submit-btn:hover { opacity: 0.9; }
.submit-btn:active { transform: scale(0.97); }

.result {
  margin-top: 18px;
  padding: 16px;
  border-radius: 12px;
  text-align: center;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.result.correct { background: #e6f9ee; border: 2px solid #34d399; }
.result.correct .result-icon { color: #34d399; }
.result.wrong { background: #fff0f0; border: 2px solid #f87171; }
.result.wrong .result-icon { color: #f87171; }

.result-icon { font-size: 1.8em; margin-bottom: 4px; }
.result-text { font-size: 0.95em; color: #333; font-weight: 600; }

.correct-answer { margin-top: 6px; font-size: 1.05em; color: #555; }
.correct-answer span { color: #f5576c; font-weight: 700; }

.hint-text {
  margin-top: 6px;
  font-size: 0.85em;
  color: #888;
  line-height: 1.5;
}

.next-btn {
  margin-top: 14px;
  padding: 11px 30px;
  background: #667eea;
  color: #fff;
  border: none;
  border-radius: 10px;
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}

.next-btn:hover { opacity: 0.85; }

.final-score { text-align: center; padding: 18px 0; }

.final-score .big-score {
  font-size: 3.8em;
  font-weight: 800;
  background: linear-gradient(135deg, #f093fb, #f5576c);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.final-score .score-label { font-size: 1.05em; color: #888; margin-top: 4px; }
.final-score .message { font-size: 1.15em; color: #333; margin-top: 18px; font-weight: 600; }

.final-btns {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  justify-content: center;
  flex-wrap: wrap;
}

.final-btns button {
  padding: 13px 24px;
  border: none;
  border-radius: 12px;
  font-size: 0.95em;
  font-weight: 600;
  cursor: pointer;
}

.retry-btn {
  background: linear-gradient(135deg, #f093fb, #f5576c);
  color: #fff;
}

.back-btn { background: #f0f2f5; color: #555; }

.hidden { display: none !important; }

.review-list { margin-top: 18px; text-align: left; }

.review-item {
  padding: 12px;
  border: 1px solid #e8ecf4;
  border-radius: 10px;
  margin-bottom: 8px;
  background: #fafbff;
}

.review-item .q { font-weight: 600; color: #333; margin-bottom: 4px; font-size: 0.9em; }
.review-item .a { color: #f5576c; font-weight: 600; font-size: 0.9em; }

.review-toggle {
  margin-top: 14px;
  background: none;
  border: none;
  color: #667eea;
  font-weight: 600;
  cursor: pointer;
  font-size: 0.9em;
}

.mode-select {
  display: flex;
  gap: 10px;
  margin-top: 16px;
  justify-content: center;
}

.mode-btn {
  padding: 10px 20px;
  border: 2px solid #e8ecf4;
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.85em;
  transition: all 0.2s;
}

.mode-btn:hover, .mode-btn.active {
  border-color: #f5576c;
  background: #fff5f7;
  color: #f5576c;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>中1社会 期末テスト対策</h1>
    <p>問題ワークの内容で学習しよう！</p>
  </div>

  <div class="stats">
    <div class="stat">
      <div class="stat-value" id="correctCount">0</div>
      <div class="stat-label">正解</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="wrongCount">0</div>
      <div class="stat-label">不正解</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="accuracy">--%</div>
      <div class="stat-label">正答率</div>
    </div>
  </div>

  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <div class="content" id="categoryScreen">
    <div class="category-grid" id="categoryGrid"></div>
  </div>

  <div class="content hidden" id="quizScreen">
    <div class="category-tag" id="categoryTag"></div>
    <div class="question-number" id="questionNumber"></div>
    <div class="question-text" id="questionText"></div>
    <div class="answer-area" id="answerArea">
      <input type="text" class="answer-input" id="answerInput" placeholder="答えを入力..." autocomplete="off">
      <button class="submit-btn" id="submitBtn" onclick="checkAnswer()">回答</button>
    </div>
    <div class="result hidden" id="resultBox">
      <div class="result-icon" id="resultIcon"></div>
      <div class="result-text" id="resultText"></div>
      <div class="correct-answer" id="correctAnswer"></div>
      <div class="hint-text" id="hintText"></div>
      <button class="next-btn" id="nextBtn" onclick="nextQuestion()">次の問題 →</button>
    </div>
  </div>

  <div class="content hidden" id="resultScreen">
    <div class="final-score">
      <div class="big-score" id="finalScore"></div>
      <div class="score-label" id="finalLabel"></div>
      <div class="message" id="finalMessage"></div>
    </div>
    <div class="final-btns">
      <button class="back-btn" onclick="goHome()">カテゴリに戻る</button>
      <button class="retry-btn" onclick="retryWrong()" id="retryBtn">間違えた問題をやり直す</button>
    </div>
    <button class="review-toggle hidden" id="reviewToggle" onclick="toggleReview()">間違えた問題を確認 ▼</button>
    <div class="review-list hidden" id="reviewList"></div>
  </div>
</div>

const categoryEmojis = {
  "日本の位置と時差": "🌏",
  "日本の領域": "🗾",
  "都道府県と地方区分": "🏯",
  "世界の気候": "🌤️",
  "寒帯・冷帯の暮らし": "❄️",
  "温帯の暮らし": "🌿",
  "乾燥帯の暮らし": "🏜️",
  "熱帯・高山の暮らし": "🌴",
  "生活文化と宗教": "🕌",
  "全範囲ミックス": "🔥",
};

let currentCategory = "";
let currentQuestions = [];
let currentIndex = 0;
let correct = 0;
let wrong = 0;
let wrongList = [];
let answered = false;

function init() {
  const grid = document.getElementById("categoryGrid");
  grid.innerHTML = "";
  const cats = Object.keys(questions).filter(c => c !== "全範囲ミックス");
  for (const cat of cats) {
    const qs = questions[cat];
    const btn = document.createElement("div");
    btn.className = "category-btn";
    btn.innerHTML = `
      <span class="emoji">${categoryEmojis[cat] || "📚"}</span>
      <div class="name">${cat}</div>
      <div class="count">${qs.length}問</div>
    `;
    btn.onclick = () => startQuiz(cat);
    grid.appendChild(btn);
  }
  const totalQ = Object.keys(questions).filter(c => c !== "全範囲ミックス").reduce((s, c) => s + questions[c].length, 0);
  const allBtn = document.createElement("div");
  allBtn.className = "category-btn";
  allBtn.innerHTML = `
    <span class="emoji">🔥</span>
    <div class="name">全範囲チャレンジ</div>
    <div class="count">${totalQ}問</div>
  `;
  allBtn.onclick = () => startQuiz("全範囲ミックス");
  grid.appendChild(allBtn);
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startQuiz(category) {
  currentCategory = category;
  if (category === "全範囲ミックス") {
    currentQuestions = shuffle(
      Object.keys(questions).filter(c => c !== "全範囲ミックス").flatMap(c => questions[c])
    );
  } else {
    currentQuestions = shuffle(questions[category]);
  }
  currentIndex = 0;
  correct = 0;
  wrong = 0;
  wrongList = [];
  answered = false;
  updateStats();
  show("quizScreen");
  showQuestion();
}

function startQuizWithQuestions(qs, category) {
  currentCategory = category;
  currentQuestions = shuffle(qs);
  currentIndex = 0;
  correct = 0;
  wrong = 0;
  wrongList = [];
  answered = false;
  updateStats();
  show("quizScreen");
  showQuestion();
}

function show(screenId) {
  ["categoryScreen", "quizScreen", "resultScreen"].forEach(id => {
    document.getElementById(id).classList.toggle("hidden", id !== screenId);
  });
}

function showQuestion() {
  answered = false;
  const q = currentQuestions[currentIndex];
  document.getElementById("categoryTag").textContent = currentCategory;
  document.getElementById("questionNumber").textContent = `第${currentIndex + 1}問 / ${currentQuestions.length}問`;
  document.getElementById("questionText").textContent = q.q;
  document.getElementById("answerInput").value = "";
  document.getElementById("answerArea").classList.remove("hidden");
  document.getElementById("resultBox").classList.add("hidden");
  document.getElementById("answerInput").focus();
  document.getElementById("progressFill").style.width = ((currentIndex / currentQuestions.length) * 100) + "%";
}

function normalize(s) {
  return s.replace(/\s+/g, "").replace(/[Ａ-Ｚａ-ｚ０-９]/g, c =>
    String.fromCharCode(c.charCodeAt(0) - 0xFEE0)
  ).toLowerCase();
}

function checkAnswer() {
  if (answered) return;
  answered = true;
  const input = document.getElementById("answerInput").value.trim();
  const q = currentQuestions[currentIndex];
  const normalizedInput = normalize(input);
  const isCorrect = q.a.some(ans => normalize(ans) === normalizedInput);

  const resultBox = document.getElementById("resultBox");
  const resultIcon = document.getElementById("resultIcon");
  const resultText = document.getElementById("resultText");
  const correctAnswerEl = document.getElementById("correctAnswer");
  const hintEl = document.getElementById("hintText");

  document.getElementById("answerArea").classList.add("hidden");
  resultBox.classList.remove("hidden", "correct", "wrong");
  hintEl.textContent = "";

  if (isCorrect) {
    correct++;
    resultBox.classList.add("correct");
    resultIcon.textContent = "⭕";
    resultText.textContent = "正解！";
    correctAnswerEl.innerHTML = "";
  } else {
    wrong++;
    wrongList.push(q);
    resultBox.classList.add("wrong");
    resultIcon.textContent = "❌";
    resultText.textContent = input ? "不正解..." : "未回答...";
    correctAnswerEl.innerHTML = `正解は <span>${q.a[0]}</span> です`;
    if (q.hint) hintEl.textContent = q.hint;
  }
  updateStats();
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= currentQuestions.length) {
    showFinalResult();
  } else {
    showQuestion();
  }
}

function updateStats() {
  document.getElementById("correctCount").textContent = correct;
  document.getElementById("wrongCount").textContent = wrong;
  const total = correct + wrong;
  document.getElementById("accuracy").textContent = total > 0 ? Math.round((correct / total) * 100) + "%" : "--%";
}

function showFinalResult() {
  show("resultScreen");
  document.getElementById("progressFill").style.width = "100%";
  const total = currentQuestions.length;
  const pct = Math.round((correct / total) * 100);
  document.getElementById("finalScore").textContent = pct + "%";
  document.getElementById("finalLabel").textContent = `${correct} / ${total} 問正解`;

  let msg;
  if (pct === 100) msg = "パーフェクト！すばらしい！🎉";
  else if (pct >= 80) msg = "とてもよくできました！👏";
  else if (pct >= 60) msg = "いい調子です！もう少し！💪";
  else if (pct >= 40) msg = "もう少しがんばろう！📖";
  else msg = "復習してもう一度チャレンジ！📝";
  document.getElementById("finalMessage").textContent = msg;

  const retryBtn = document.getElementById("retryBtn");
  const reviewToggle = document.getElementById("reviewToggle");
  const reviewList = document.getElementById("reviewList");

  if (wrongList.length > 0) {
    retryBtn.classList.remove("hidden");
    reviewToggle.classList.remove("hidden");
    reviewList.classList.add("hidden");
    reviewList.innerHTML = wrongList.map(q =>
      `<div class="review-item"><div class="q">Q. ${q.q}</div><div class="a">A. ${q.a[0]}</div></div>`
    ).join("");
  } else {
    retryBtn.classList.add("hidden");
    reviewToggle.classList.add("hidden");
    reviewList.classList.add("hidden");
  }
}

function retryWrong() {
  startQuizWithQuestions([...wrongList], currentCategory + "（復習）");
}

function toggleReview() {
  const list = document.getElementById("reviewList");
  const btn = document.getElementById("reviewToggle");
  if (list.classList.contains("hidden")) {
    list.classList.remove("hidden");
    btn.textContent = "間違えた問題を閉じる ▲";
  } else {
    list.classList.add("hidden");
    btn.textContent = "間違えた問題を確認 ▼";
  }
}

function goHome() {
  correct = 0;
  wrong = 0;
  updateStats();
  document.getElementById("progressFill").style.width = "0%";
  show("categoryScreen");
}

document.getElementById("answerInput").addEventListener("keydown", e => {
  if (e.key === "Enter") checkAnswer();
});

init();
</script>
